<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
  <defs>
    <linearGradient id="cyph3r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cyph3r-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cyph3r-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="cyph3r-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#cyph3r-bg)"/>
  <rect width="1200" height="360" fill="url(#cyph3r-grid)"/>

  <!-- Accent Corner Brackets -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 1170 60 L 1170 30 L 1140 30" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 30 300 L 30 330 L 60 330" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 1170 300 L 1170 330 L 1140 330" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Radar Concentric Circles Right -->
  <circle cx="1000" cy="180" r="140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,8"/>
  <circle cx="1000" cy="180" r="95" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="1000" cy="180" r="50" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6,6"/>
  <circle cx="1000" cy="180" r="6" fill="#06b6d4" filter="url(#glow-cyan)"/>
  <line x1="860" y1="180" x2="1140" y2="180" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.3"/>
  <line x1="1000" y1="40" x2="1000" y2="320" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Graph Nodes on Radar -->
  <circle cx="1060" cy="130" r="4" fill="#a855f7"/>
  <line x1="1000" y1="180" x2="1060" y2="130" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="945" cy="115" r="3.5" fill="#06b6d4"/>
  <line x1="1000" y1="180" x2="945" y2="115" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="1075" cy="235" r="4" fill="#38bdf8"/>
  <line x1="1000" y1="180" x2="1075" y2="235" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="920" cy="220" r="3" fill="#a855f7"/>
  <line x1="1000" y1="180" x2="920" y2="220" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Left Header Tag -->
  <rect x="70" y="55" width="220" height="26" rx="13" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="85" cy="68" r="4" fill="#06b6d4"/>
  <text x="98" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#38bdf8">OSINT // ENTITY GRAPH</text>

  <!-- Main Hero Title -->
  <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="#f8fafc">CYPH<tspan fill="#06b6d4">3</tspan>R</text>

  <!-- Subtitle Tagline -->
  <text x="70" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">AI-Powered Digital Footprint Intelligence &amp; Entity Correlation</text>

  <!-- Description paragraph -->
  <text x="70" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#64748b">Public-source discovery · Facial recognition embeddings · Temporal graph reconstruction · Threat analysis</text>

  <!-- Capability Badges -->
  <g transform="translate(70, 275)">
    <rect width="130" height="28" rx="6" fill="#131926" stroke="#1e293b" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#cbd5e1">GRAPH ENGINE</text>
  </g>
  <g transform="translate(210, 275)">
    <rect width="150" height="28" rx="6" fill="#131926" stroke="#1e293b" stroke-width="1"/>
    <text x="75" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#cbd5e1">FACE EMBEDDINGS</text>
  </g>
  <g transform="translate(370, 275)">
    <rect width="135" height="28" rx="6" fill="#131926" stroke="#1e293b" stroke-width="1"/>
    <text x="67.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#cbd5e1">SEMANTIC NER</text>
  </g>
  <g transform="translate(515, 275)">
    <rect width="145" height="28" rx="6" fill="#131926" stroke="#1e293b" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#cbd5e1">AUDIT PROVENANCE</text>
  </g>
</svg>
